services:
  - type: web
    name: testexplain
    runtime: python
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: PYTHONPATH=src uvicorn testexplain.api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gateframe/gemini-2.5-flash
      - key: TRUSTED_PROXY_IPS
        sync: false
